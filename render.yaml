# Render blueprint: one web service with a persistent disk for the database and uploads.
services:
  - type: web
    name: gallium
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATA_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
    disk:
      name: gallium-data
      mountPath: /var/data
      sizeGB: 10
